<html lang="en">
<head>

<meta property="og:description" content="Business Development Manager at DiXiO">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #050a14;
    --card:      rgba(13, 25, 45, 0.72);
    --card-edge: rgba(72, 130, 220, 0.22);
    --blue:      #2f8dff;
    --blue-glow: rgba(47, 141, 255, 0.55);
    --text:      #f2f6fc;
    --muted:     #9db0cf;

    --sp-xs:  clamp(6px,  1.5vw, 10px);
    --sp-sm:  clamp(10px, 2.5vw, 16px);
    --sp-md:  clamp(16px, 4vw,   26px);
    --sp-lg:  clamp(24px, 6vw,   40px);

    --fs-xs:   clamp(9px,  2.2vw, 11px);
    --fs-md:   clamp(15px, 4vw,   18px);
    --fs-lg:   clamp(18px, 5vw,   24px);
    --fs-xl:   clamp(28px, 8vw,   40px);

    --avatar: clamp(150px, 46vw, 220px);
    --icon-size: clamp(56px, 16vw, 72px);
    --icon-svg:  clamp(22px, 6vw,  28px);
  }

  html { font-size: 16px; }

  body {
    font-family: 'Nunito Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Ambient backdrop ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(47,141,255,0.16) 0%, transparent 65%),
      radial-gradient(ellipse 50% 35% at 100% 55%, rgba(18,99,217,0.14) 0%, transparent 70%),
      radial-gradient(ellipse 50% 30% at 0% 35%, rgba(18,99,217,0.10) 0%, transparent 70%),
      linear-gradient(180deg, #071022 0%, var(--bg) 45%, #03070f 100%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 0 var(--sp-md) var(--sp-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Hero ── */
  .hero {
    position: relative;
    padding-top: var(--sp-lg);
    text-align: center;
  }

  /* glowing planet-arc top-right */
  .hero .arc {
    position: absolute;
    top: clamp(-260px, -60vw, -180px);
    right: clamp(-260px, -55vw, -170px);
    width: clamp(340px, 100vw, 460px);
    height: clamp(340px, 100vw, 460px);
    border-radius: 50%;
    border: 1.5px solid rgba(90,160,255,0.55);
    box-shadow:
      0 0 40px rgba(47,141,255,0.35),
      inset 0 0 60px rgba(47,141,255,0.18);
    background: radial-gradient(circle at 30% 70%, rgba(47,141,255,0.10), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .hero-top {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: var(--sp-md);
  }

  /* Logo image */
  .brand { display: block; line-height: 0; }
  .brand img {
    width: clamp(96px, 30vw, 132px);
    height: auto;
    display: block;
    filter: drop-shadow(0 0 14px rgba(47,141,255,0.35));
  }
  .footer .brand { margin: 0 auto; }
  .footer .brand img { width: clamp(84px, 24vw, 110px); }


  /* Avatar row */
  .hero-mid {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    margin-bottom: var(--sp-md);
  }

  .avatar {
    width: var(--avatar);
    height: var(--avatar);
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(160deg, #6fb4ff 0%, var(--blue) 45%, #0b3f9a 100%);
    box-shadow:
      0 0 0 6px rgba(47,141,255,0.12),
      0 0 60px var(--blue-glow),
      0 18px 50px rgba(0,0,0,0.55);
    position: relative;
  }
  .avatar::before {
    content: '';
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 1px solid rgba(47,141,255,0.25);
    pointer-events: none;
  }
  .avatar img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 30%;
    display: block;
    border: 3px solid #050a14;
    background: #1c2c48;
  }

  .name {
    font-size: clamp(30px, 9vw, 44px);
    font-weight: 800;
    letter-spacing: 0.5px;
    line-height: 1.1;
    color: #fff;
    margin-bottom: clamp(6px, 1.5vw, 10px);
  }
  .role {
    font-size: var(--fs-md);
    font-weight: 600;
    color: #dbe6f7;
    line-height: 1.4;
    padding: 0 var(--sp-sm);
  }
  .company {
    font-size: var(--fs-lg);
    font-weight: 700;
    color: #fff;
    margin-top: clamp(4px, 1vw, 8px);
    letter-spacing: 0.5px;
  }

  /* ── Save Contact ── */
  .save-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 16px);
    margin: var(--sp-md) 0 var(--sp-md);
    padding: clamp(14px, 4vw, 18px) var(--sp-md);
    border-radius: 999px;
    border: 1px solid rgba(160,205,255,0.45);
    background: linear-gradient(180deg, #4ba3ff 0%, #2483f7 55%, #1466dc 100%);
    color: #fff;
    font-family: inherit;
    font-size: clamp(16px, 4.6vw, 21px);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    box-shadow:
      0 0 0 1px rgba(47,141,255,0.25),
      0 0 34px rgba(47,141,255,0.45),
      inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform 0.15s, filter 0.15s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }
  .save-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.22) 50%, transparent 100%);
    transform: translateX(-120%);
    transition: transform 0.6s ease;
  }
  .save-btn:hover::after { transform: translateX(120%); }
  .save-btn:active { transform: scale(0.98); filter: brightness(1.05); }
  .save-btn .ic {
    width: clamp(36px, 10vw, 46px);
    height: clamp(36px, 10vw, 46px);
    border-radius: 12px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.28);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .save-btn .ic svg { width: 58%; height: 58%; }

  /* ── Quick icon row ── */
  .quick {
    display: flex;
    justify-content: space-between;
    gap: clamp(4px, 1.5vw, 10px);
    margin-bottom: var(--sp-md);
  }
  .quick a, .quick button {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 2.2vw, 12px);
    text-decoration: none;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .quick .circle {
    width: var(--icon-size);
    height: var(--icon-size);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #0f1f3a, #0a1426);
    border: 1.5px solid rgba(72,140,240,0.7);
    box-shadow: 0 0 18px rgba(47,141,255,0.22), inset 0 0 12px rgba(47,141,255,0.08);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .quick .circle svg { width: var(--icon-svg); height: var(--icon-svg); }
  .quick a:active .circle, .quick button:active .circle {
    transform: scale(0.9);
    background: var(--blue);
    box-shadow: 0 0 26px var(--blue-glow);
  }
  .quick .lbl {
    font-size: clamp(12px, 3.4vw, 15px);
    font-weight: 600;
    color: #e6edf8;
    white-space: nowrap;
  }

  /* ── Detail rows ── */
  .rows { display: flex; flex-direction: column; gap: clamp(8px, 2.2vw, 12px); margin-bottom: var(--sp-lg); }
  .row {
    display: flex;
    align-items: center;
    gap: clamp(12px, 3.5vw, 18px);
    padding: clamp(14px, 4vw, 20px) clamp(14px, 4vw, 20px);
    border-radius: clamp(12px, 3.5vw, 16px);
    background: var(--card);
    border: 1px solid var(--card-edge);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    text-decoration: none;
    font-size: clamp(15px, 4.3vw, 19px);
    font-weight: 600;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    min-width: 0;
  }
  .row:active { transform: scale(0.99); border-color: rgba(47,141,255,0.6); background: rgba(19,36,64,0.85); }
  .row .ri { width: clamp(20px, 5.5vw, 24px); height: clamp(20px, 5.5vw, 24px); flex-shrink: 0; }
  .row .rt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.85; }

  /* ── Let's Connect ── */
  .connect-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--sp-sm);
    margin-bottom: var(--sp-sm);
  }
  .connect-head h2 {
    font-size: clamp(18px, 5.4vw, 24px);
    font-weight: 600;
    color: #f0f4fb;
  }

  .social {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(8px, 2.5vw, 14px);
    margin-bottom: clamp(8px, 2.5vw, 14px);
  }
  .tile {
    display: flex;
    align-items: center;
    gap: clamp(10px, 3vw, 14px);
    padding: clamp(14px, 4vw, 18px) clamp(12px, 3.5vw, 16px);
    border-radius: clamp(12px, 3.5vw, 16px);
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: #fff;
    text-decoration: none;
    font-size: clamp(15px, 4.2vw, 18px);
    font-weight: 600;
    transition: transform 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
    min-width: 0;
  }
  .tile:active { transform: scale(0.98); border-color: rgba(47,141,255,0.6); }
  .tile .badge {
    width: clamp(30px, 8vw, 36px);
    height: clamp(30px, 8vw, 36px);
    border-radius: 7px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .tile .badge svg { width: 60%; height: 60%; }
  .tile .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .chev { width: 12px; height: 12px; }


  /* ── Company profile ── */
  .profile {
    position: relative;
    display: flex;
    align-items: center;
    gap: clamp(12px, 3.5vw, 18px);
    padding: clamp(16px, 4.5vw, 24px) clamp(14px, 4vw, 20px);
    border-radius: clamp(14px, 4vw, 18px);
    background:
      radial-gradient(ellipse 60% 120% at 100% 100%, rgba(47,141,255,0.22), transparent 60%),
      var(--card);
    border: 1px solid var(--card-edge);
    color: #fff;
    text-decoration: none;
    overflow: hidden;
    margin-bottom: var(--sp-lg);
    transition: transform 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .profile:active { transform: scale(0.99); border-color: rgba(47,141,255,0.6); }
  .profile::before {
    content: '';
    position: absolute;
    right: -30px; bottom: -70px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, rgba(120,180,255,0.35), rgba(47,141,255,0.08) 55%, transparent 70%);
    filter: blur(2px);
    pointer-events: none;
  }
  .profile .doc {
    width: clamp(56px, 15vw, 68px);
    height: clamp(56px, 15vw, 68px);
    border-radius: 14px;
    background: rgba(47,141,255,0.14);
    border: 1px solid rgba(47,141,255,0.35);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .profile .doc svg { width: 50%; height: 50%; }
  .profile .pt { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .profile .pt strong { display: block; font-size: clamp(17px, 4.8vw, 21px); font-weight: 600; margin-bottom: 4px; }
  .profile .pt span { font-size: clamp(12px, 3.4vw, 14px); color: var(--muted); font-weight: 400; }
  .profile .chev { position: relative; z-index: 1; }


  /* ── Footer ── */
  .footer { text-align: center; padding-bottom: env(safe-area-inset-bottom, 0); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    left: 50%; bottom: 28px;
    transform: translate(-50%, 20px);
    background: #10213b;
    border: 1px solid rgba(47,141,255,0.5);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 50;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    max-width: calc(100vw - 32px);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero      { animation: fadeUp 0.45s ease both; }
  .save-btn  { animation: fadeUp 0.45s 0.08s ease both; }
  .quick     { animation: fadeUp 0.45s 0.14s ease both; }
  .rows      { animation: fadeUp 0.45s 0.20s ease both; }
  .connect   { animation: fadeUp 0.45s 0.26s ease both; }
  .footer { animation: fadeUp 0.45s 0.32s ease both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ── Small phones ── */
  @media (max-width: 360px) {
    .social { grid-template-columns: 1fr; }
  }

  a, button { -webkit-tap-highlight-color: transparent; }
</style>
</head>

<script>
  (function () {
    var btn = document.getElementById('shareBtn');
    var toast = document.getElementById('toast');
    var data = {
      title: 'Che Morrison – DiXiO',
      text: 'Che Morrison · Business Development Manager at DiXiO',
      url: location.href
    };
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(function () { toast.classList.remove('show'); }, 1800);
    }
    function copy() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(data.url).then(function () { showToast('Link copied'); },
          function () { showToast(data.url); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = data.url; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast('Link copied'); } catch (e) { showToast(data.url); }
        document.body.removeChild(ta);
      }
    }
    btn.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share(data).catch(function (e) { if (e && e.name !== 'AbortError') copy(); });
      } else {
        copy();
      }
    });
  })();
</script>
