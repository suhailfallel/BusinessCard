<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #121212;
    --card:      #1d1d1d;
    --card-edge: rgba(255,255,255,0.09);
    --line:      rgba(255,255,255,0.14);
    --text:      #ffffff;
    --muted:     #a9a9a9;

    --sp-xs:  clamp(6px,  1.5vw, 10px);
    --sp-sm:  clamp(10px, 2.5vw, 16px);
    --sp-md:  clamp(16px, 4vw,   26px);
    --sp-lg:  clamp(24px, 6vw,   40px);

    --fs-xs:   clamp(9px,  2.2vw, 11px);
    --fs-md:   clamp(14px, 3.8vw, 17px);
    --fs-lg:   clamp(18px, 5vw,   24px);

    --avatar: clamp(150px, 46vw, 220px);
    --icon-size: clamp(56px, 16vw, 72px);
    --icon-svg:  clamp(22px, 6vw,  28px);
  }

  html { font-size: 16px; }

  body {
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Backdrop: soft vignette ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 45% at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 70%),
      linear-gradient(180deg, #171717 0%, var(--bg) 50%, #0c0c0c 100%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 0 var(--sp-md) var(--sp-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Swirl lines (from the printed card) ── */
  .swirl {
    position: absolute;
    left: 0; right: 0; top: 0;
    width: 100%;
    height: auto;
    pointer-events: none;
    z-index: 0;
    opacity: 0.9;
  }

  /* ── Hero ── */
  .hero {
    position: relative;
    z-index: 1;
    padding-top: var(--sp-lg);
    text-align: center;
  }

  .brand { display: block; line-height: 0; margin: 0 auto var(--sp-lg); width: fit-content; }
  .brand img {
    width: clamp(110px, 32vw, 150px);
    height: auto;
    display: block;
  }
  .footer .brand { margin: 0 auto; }
  .footer .brand img { width: clamp(90px, 26vw, 120px); }

  .hero-mid {
    display: flex;
    justify-content: center;
    margin-bottom: var(--sp-md);
  }

  .avatar {
    width: var(--avatar);
    height: var(--avatar);
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(160deg, #ffffff 0%, #bdbdbd 60%, #7a7a7a 100%);
    box-shadow:
      0 0 0 8px rgba(255,255,255,0.05),
      0 18px 50px rgba(0,0,0,0.7);
    position: relative;
  }
  .avatar::before {
    content: '';
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    pointer-events: none;
  }
  .avatar img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 25%;
    display: block;
    border: 3px solid var(--bg);
    background: #2a2a2a;
  }

  .name {
    font-size: clamp(28px, 8.4vw, 40px);
    font-weight: 700;
    letter-spacing: 0.2px;
    line-height: 1.15;
    color: #fff;
    margin-bottom: clamp(8px, 2vw, 12px);
  }
  .name-rule {
    width: clamp(90px, 28vw, 140px);
    height: 1px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    margin: 0 auto clamp(8px, 2vw, 12px);
    opacity: 0.8;
  }
  .role {
    font-size: var(--fs-md);
    font-weight: 400;
    color: #e4e4e4;
    line-height: 1.4;
    padding: 0 var(--sp-sm);
  }
  .company {
    font-size: clamp(13px, 3.5vw, 15px);
    font-weight: 500;
    color: var(--muted);
    margin-top: clamp(4px, 1vw, 8px);
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  /* ── Save Contact ── */
  .save-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 16px);
    margin: var(--sp-md) 0 var(--sp-md);
    padding: clamp(14px, 4vw, 18px) var(--sp-md);
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.6);
    background: linear-gradient(180deg, #ffffff 0%, #ededed 100%);
    color: #111;
    font-family: inherit;
    font-size: clamp(16px, 4.6vw, 20px);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    box-shadow:
      0 0 30px rgba(255,255,255,0.12),
      0 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.15s, filter 0.15s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }
  .save-btn:active { transform: scale(0.98); filter: brightness(0.96); }
  .save-btn .ic {
    width: clamp(36px, 10vw, 46px);
    height: clamp(36px, 10vw, 46px);
    border-radius: 12px;
    background: #111;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .save-btn .ic svg { width: 58%; height: 58%; }

  /* ── Quick icon row ── */
  .quick {
    display: flex;
    justify-content: space-between;
    gap: clamp(4px, 1.5vw, 10px);
    margin-bottom: var(--sp-md);
  }
  .quick a, .quick button {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 2.2vw, 12px);
    text-decoration: none;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .quick .circle {
    width: var(--icon-size);
    height: var(--icon-size);
    border-radius: 50%;
    background: var(--card);
    border: 1.5px solid rgba(255,255,255,0.35);
    box-shadow: 0 8px 20px rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
  }
  .quick .circle svg { width: var(--icon-svg); height: var(--icon-svg); }
  .quick a:active .circle, .quick button:active .circle {
    transform: scale(0.9);
    background: #fff;
    border-color: #fff;
  }
  .quick a:active .circle svg *, .quick button:active .circle svg * { fill: #111; stroke: #111; }
  .quick a:active .circle svg [data-keep], .quick button:active .circle svg [data-keep] { fill: #fff; stroke: #fff; }
  .quick .lbl {
    font-size: clamp(12px, 3.4vw, 14px);
    font-weight: 500;
    color: #e6e6e6;
    white-space: nowrap;
  }

  /* ── Detail rows ── */
  .rows { display: flex; flex-direction: column; gap: clamp(8px, 2.2vw, 12px); margin-bottom: var(--sp-lg); }
  .row {
    display: flex;
    align-items: center;
    gap: clamp(12px, 3.5vw, 18px);
    padding: clamp(14px, 4vw, 20px) clamp(14px, 4vw, 20px);
    border-radius: clamp(12px, 3.5vw, 16px);
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: #fff;
    text-decoration: none;
    font-size: clamp(15px, 4.2vw, 18px);
    font-weight: 500;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    min-width: 0;
  }
  .row:active { transform: scale(0.99); border-color: rgba(255,255,255,0.4); background: #262626; }
  .row .ri { width: clamp(20px, 5.5vw, 24px); height: clamp(20px, 5.5vw, 24px); flex-shrink: 0; }
  .row .rt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.8; }

  /* ── Let's Connect ── */
  .connect-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--sp-sm);
    margin-bottom: var(--sp-sm);
  }
  .connect-head h2 {
    font-size: clamp(18px, 5.2vw, 23px);
    font-weight: 600;
    color: #fff;
  }

  .social {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(8px, 2.5vw, 14px);
    margin-bottom: var(--sp-lg);
  }
  .tile {
    display: flex;
    align-items: center;
    gap: clamp(10px, 3vw, 14px);
    padding: clamp(14px, 4vw, 18px) clamp(12px, 3.5vw, 16px);
    border-radius: clamp(12px, 3.5vw, 16px);
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: #fff;
    text-decoration: none;
    font-size: clamp(15px, 4.2vw, 17px);
    font-weight: 500;
    transition: transform 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
    min-width: 0;
  }
  .tile:active { transform: scale(0.98); border-color: rgba(255,255,255,0.4); }
  .tile .badge {
    width: clamp(30px, 8vw, 36px);
    height: clamp(30px, 8vw, 36px);
    border-radius: 8px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .tile .badge svg { width: 62%; height: 62%; }
  .tile .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .chev { width: 12px; height: 12px; }

  /* ── Footer ── */
  .footer { text-align: center; padding-bottom: env(safe-area-inset-bottom, 0); position: relative; z-index: 1; }
  .footer-site {
    margin-top: var(--sp-sm);
    font-size: clamp(12px, 3.2vw, 14px);
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.5px;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    left: 50%; bottom: 28px;
    transform: translate(-50%, 20px);
    background: #fff;
    color: #111;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 50;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    max-width: calc(100vw - 32px);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero      { animation: fadeUp 0.45s ease both; }
  .save-btn  { animation: fadeUp 0.45s 0.08s ease both; }
  .quick     { animation: fadeUp 0.45s 0.14s ease both; }
  .rows      { animation: fadeUp 0.45s 0.20s ease both; }
  .connect   { animation: fadeUp 0.45s 0.26s ease both; }
  .footer    { animation: fadeUp 0.45s 0.32s ease both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ── Small phones ── */
  @media (max-width: 430px) {
    .social { grid-template-columns: 1fr; }
  }

  a, button { -webkit-tap-highlight-color: transparent; }
</style>
</head>

<script>
  (function () {
    var btn = document.getElementById('shareBtn');
    var toast = document.getElementById('toast');
    var data = {
      title: 'Mohammed Hamed – Nusuk Development',
      text: 'Mohammed Hamed · Managing Director at Nusuk Development',
      url: location.href
    };
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(function () { toast.classList.remove('show'); }, 1800);
    }
    function copy() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(data.url).then(function () { showToast('Link copied'); },
          function () { showToast(data.url); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = data.url; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast('Link copied'); } catch (e) { showToast(data.url); }
        document.body.removeChild(ta);
      }
    }
    btn.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share(data).catch(function (e) { if (e && e.name !== 'AbortError') copy(); });
      } else {
        copy();
      }
    });
  })();
</script>

</body>
</html>
